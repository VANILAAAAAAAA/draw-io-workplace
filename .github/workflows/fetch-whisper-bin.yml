name: Temporary Whisper Binary Fetch

on:
  push:
    paths:
      - .github/workflows/fetch-whisper-bin.yml
  workflow_dispatch:

jobs:
  fetch-binary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download whisper.cpp Linux binary
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 5 \
            -o whisper-bin-ubuntu-x64.tar.gz \
            https://github.com/ggml-org/whisper.cpp/releases/download/b4938/whisper-bin-ubuntu-x64.tar.gz
          echo "f4cfc1f969a13805908fb72043ce7cc896eb42e0b8afbe841dc8e7298923b061  whisper-bin-ubuntu-x64.tar.gz" | sha256sum -c -
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-bin-ubuntu-x64
          path: whisper-bin-ubuntu-x64.tar.gz
          compression-level: 0
          retention-days: 1
