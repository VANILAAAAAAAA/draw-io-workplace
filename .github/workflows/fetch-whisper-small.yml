name: Temporary Whisper Model Fetch

on:
  push:
    paths:
      - .github/workflows/fetch-whisper-small.yml
  workflow_dispatch:

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download verified Whisper small.en Q5 model
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 5 \
            -o ggml-small.en-q5_1.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.en-q5_1.bin
          echo "bfdff4894dcb76bbf647d56263ea2a96645423f1669176f4844a1bf8e478ad30  ggml-small.en-q5_1.bin" | sha256sum -c -
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-small-en-q5-model
          path: ggml-small.en-q5_1.bin
          compression-level: 0
          retention-days: 1
