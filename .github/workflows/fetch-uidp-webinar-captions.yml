name: Temporary UIDP Webinar Captions Fetch

on:
  push:
    paths:
      - .github/workflows/fetch-uidp-webinar-captions.yml
  workflow_dispatch:

jobs:
  captions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install yt-dlp
        run: python -m pip install --disable-pip-version-check yt-dlp
      - name: Retrieve public webinar captions
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p captions
          cd captions
          URL='https://player.vimeo.com/video/1215285984?app_id=122963&dnt=1&h=e56b00bfdc'
          REFERER='https://uidp.org/webinar/now-launching-the-uidp-i-phd-scholars-program/'
          yt-dlp --referer "$REFERER" --list-subs "$URL" | tee subtitle-list.txt || true
          yt-dlp --referer "$REFERER" --skip-download --write-subs --write-auto-subs \
            --sub-langs 'en.*' --sub-format vtt -o 'uidp-webinar.%(ext)s' "$URL" || true
          find . -maxdepth 2 -type f -printf '%p %s bytes\n'
      - name: Upload caption artifact
        uses: actions/upload-artifact@v4
        with:
          name: uidp-webinar-captions
          path: captions
          retention-days: 1
